<form id="quote-form" data-quote-form>
                        <input type="hidden" name="access_key" value="283d11cd-6ec5-41d0-a93c-303af0ec4f27" />
                        <input type="hidden" name="subject" value="New Quote Request – SportsGift Trophies ({{subject}})">
                        <input type="hidden" name="redirect" value="" />

                        <div class="form-row2">
                            <div class="form-group"><label for="contact-name">Full name *</label><input id="contact-name" type="text" name="name" placeholder="Jane Smith" required></div>
                            <div class="form-group"><label for="contact-email">Email address *</label><input id="contact-email" type="email" name="email" placeholder="you@example.com" required></div>
                        </div>
                        <div class="form-row2">
                            <div class="form-group"><label for="contact-phone">Phone number</label><input id="contact-phone" type="tel" name="phone" placeholder="0400 000 000"></div>
                            <div class="form-group"><label for="contact-organisation">Organisation / club name</label><input id="contact-organisation" type="text" name="organisation" placeholder="e.g. Gymea FC"></div>
                        </div>
                        <div class="form-row2">
                            <div class="form-group">
                                <label for="contact-sport">Sport / category</label>
                                <select id="contact-sport" name="sport">
                                    <option value="">Select…</option>
                                    <option>Aussie Rules</option><option>Basketball</option><option>Cricket</option><option>Dance</option><option>Football</option><option>Netball</option><option>Rugby</option>
                                    <option>Swimming</option><option>Athletics</option><option>Tennis</option>
                                    <option>Golf</option><option>Multi-sport</option><option>School</option>
                                    <option>Corporate</option><option>Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="contact-quantity">Approximate quantity</label>
                                <select id="contact-quantity" name="quantity">
                                    <option value="">Select…</option>
                                    <option>1-10</option><option>11-25</option><option>26-50</option>
                                    <option>51-100</option><option>100+</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row2">
                            <div class="form-group"><label for="contact-event_date">Event / presentation date</label><input id="contact-event_date" type="date" name="event_date"></div>
                            <div class="form-group">
                                <label for="contact-product_interest">Product interest</label>
                                <select id="contact-product_interest" name="product_interest">
                                    <option value="">Select…</option>
                                    <option>Trophies</option><option>Medals</option><option>Plaques &amp; Shields</option>
                                    <option>Perpetual Awards</option><option>Drinkware</option><option>Name Badges</option>
                                    <option>Not sure yet</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="contact-message">Message / additional details</label>
                            <textarea id="contact-message" name="message" placeholder="Tell us more about your order, deadlines, or anything else we should know…"></textarea>
                        </div>
                        <button type="submit" class="form-submit">Send quote request</button>
                        <p class="form-status" role="alert" hidden></p>
                    </form>
