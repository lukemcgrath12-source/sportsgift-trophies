<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SportsGift Trophies">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="62%">
      <stop offset="0%"  stop-color="#2BBCD6"/>
      <stop offset="100%" stop-color="#0A3D61"/>
    </radialGradient>
    <!-- Clip everything to the circle -->
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="49"/>
    </clipPath>
  </defs>

  <!-- Gradient circle background -->
  <circle cx="50" cy="50" r="49" fill="url(#bg)"/>

  <!-- Everything below clipped to circle -->
  <g clip-path="url(#circle-clip)" fill="white">

    <!-- Crown / leaf burst — solid filled fan of petals -->
    <!-- Centre petal -->
    <ellipse cx="50" cy="18" rx="3" ry="9"/>
    <!-- Inner left -->
    <ellipse cx="50" cy="18" rx="2.6" ry="8.5" transform="rotate(-22 50 28)"/>
    <!-- Inner right -->
    <ellipse cx="50" cy="18" rx="2.6" ry="8.5" transform="rotate(22 50 28)"/>
    <!-- Mid left -->
    <ellipse cx="50" cy="19" rx="2.2" ry="7.5" transform="rotate(-42 50 28)"/>
    <!-- Mid right -->
    <ellipse cx="50" cy="19" rx="2.2" ry="7.5" transform="rotate(42 50 28)"/>
    <!-- Outer left -->
    <ellipse cx="50" cy="20" rx="1.8" ry="6.5" transform="rotate(-60 50 28)"/>
    <!-- Outer right -->
    <ellipse cx="50" cy="20" rx="1.8" ry="6.5" transform="rotate(60 50 28)"/>

    <!-- Trophy cup rim bar -->
    <rect x="31" y="27" width="38" height="5.5" rx="2.75"/>

    <!-- Trophy cup bowl — solid filled shape -->
    <path d="M34 32.5
             C33 37 32 41 32 45
             C32 52 40 57.5 50 58
             C60 57.5 68 52 68 45
             C68 41 67 37 66 32.5
             Z"/>

    <!-- Left handle — solid filled arch -->
    <path d="M35 38
             C24 38 21 44 21 48
             C21 53 25 56 31 57
             L33 54
             C29 53 27 51 27 48
             C27 45 29 42 35 41
             Z"/>

    <!-- Right handle — solid filled arch -->
    <path d="M65 38
             C76 38 79 44 79 48
             C79 53 75 56 69 57
             L67 54
             C71 53 73 51 73 48
             C73 45 71 42 65 41
             Z"/>

    <!-- Stem -->
    <rect x="45" y="58" width="10" height="9" rx="1"/>

    <!-- Upper base bar -->
    <rect x="37" y="67" width="26" height="5" rx="2"/>

    <!-- Lower base bar -->
    <rect x="33" y="72" width="34" height="6" rx="2.5"/>

  </g>
</svg>
